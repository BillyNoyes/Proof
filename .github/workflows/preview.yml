name: Theme Proof

on:
  workflow_call:
    inputs:
      config:
        description: Relative path to theme-proof.config.json
        type: string
        default: theme-proof.config.json
      environment:
        description: GitHub Environment containing the Shopify credential
        type: string
        default: theme-preview
      shopify-cli-version:
        description: Pinned Shopify CLI version
        type: string
        default: 4.8.0
    secrets:
      SHOPIFY_CLI_THEME_TOKEN:
        description: Password generated by Shopify's Theme Access app
        required: true
      SHOPIFY_FLAG_STORE:
        description: Full myshopify.com store domain
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: theme-proof-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build theme artifact
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and stage theme
        id: build
        uses: BillyNoyes/Proof/actions/build@main
        with:
          config: ${{ inputs.config }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.theme-path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy theme preview
    if: github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/theme-proof-artifact
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Shopify CLI
        env:
          SHOPIFY_CLI_VERSION: ${{ inputs.shopify-cli-version }}
        run: npm install --global "@shopify/cli@$SHOPIFY_CLI_VERSION" --ignore-scripts
      - name: Deploy and comment
        uses: BillyNoyes/Proof@main
        with:
          mode: deploy
          theme-path: ${{ runner.temp }}/theme-proof-artifact
          store: ${{ secrets.SHOPIFY_FLAG_STORE }}
          password: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          github-token: ${{ github.token }}

  cleanup:
    name: Remove theme preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Shopify CLI
        env:
          SHOPIFY_CLI_VERSION: ${{ inputs.shopify-cli-version }}
        run: npm install --global "@shopify/cli@$SHOPIFY_CLI_VERSION" --ignore-scripts
      - name: Delete preview and update comment
        uses: BillyNoyes/Proof@main
        with:
          mode: cleanup
          store: ${{ secrets.SHOPIFY_FLAG_STORE }}
          password: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          github-token: ${{ github.token }}

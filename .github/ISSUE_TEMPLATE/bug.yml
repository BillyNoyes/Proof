name: Bug report
description: Report reproducible Theme Proof behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove store domains, credentials, customer data, and other sensitive information. Report security issues privately through the Security tab.
  - type: input
    id: commit
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runner operating system, Node.js version, and Shopify CLI version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
